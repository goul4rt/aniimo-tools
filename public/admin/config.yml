backend:
  name: github
  repo: goul4rt/aniimo-tools
  branch: main
  base_url: https://sveltia-cms-auth.extremeplays4.workers.dev
  # Repositório é público: pede só acesso a repos públicos, não "repo" completo (público+privado).
  auth_scope: public_repo

media_folder: public/uploads/blog
public_folder: /uploads/blog

collections:
  - name: blog
    label: Blog
    label_singular: Post
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Título, name: titulo, widget: string }
      - { label: Resumo, name: resumo, widget: text, hint: 'Uma frase. Aparece no card e abaixo do título.' }
      - { label: Autor, name: autor, widget: string, default: Comunidade }
      - { label: Categoria, name: categoria, widget: select, options: [aviso, guia, time, update] }
      - { label: Capa, name: capa, widget: image, required: false, hint: 'Opcional. Sem imagem, o card usa a cor da categoria.' }
      - { label: Destaque, name: destaque, widget: boolean, default: false, hint: 'Liga o post no topo do blog e no bloco da home.' }
      - { label: Publicado em, name: publicadoEm, widget: datetime, format: 'YYYY-MM-DD' }
      - { label: Conteúdo, name: body, widget: markdown }
